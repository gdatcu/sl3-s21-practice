name: hapifyMe Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Capitolul 3.8, Exercitiul 1: rulare in fiecare noapte
  schedule:
    - cron: '0 2 * * *'        # 02:00 UTC = 04:00 ora Romaniei iarna / 05:00 vara
  workflow_dispatch:           # Buton "Run workflow" pentru rulare manuala

permissions:
  contents: write              # Suficient pentru publicarea pe gh-pages

jobs:
  test-execution:
    runs-on: ubuntu-latest

    steps:
      # Pasul 1: Descarca codul
      - name: Checkout Code
        uses: actions/checkout@v7

      # Pasul 2: Java 21 + cache pentru dependentele Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Pasul 3: Ruleaza testele (credentialele vin din GitHub Secrets)
      - name: Run Tests with Maven
        id: tests
        run: mvn clean test
        continue-on-error: true    # Continuam ca sa generam raportul...
        env:
          HAPIFY_USER: ${{ secrets.HAPIFY_USER }}
          HAPIFY_PASS: ${{ secrets.HAPIFY_PASS }}
          # Capitolul 3.8, Exercitiul 2: variabila (nu secret!) pentru URL-ul de baza
          HAPIFY_BASE_URL: ${{ vars.HAPIFY_BASE_URL }}

      # Pasul 4: Aduce istoricul rapoartelor anterioare (pentru Trend)
      - name: Load Allure History
        if: always()
        continue-on-error: true    # Prima rulare: gh-pages lipseste
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      # Pasul 5: Genereaza raportul cu istoric
      - name: Build Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_history: allure-history

      # Pasul 6: Publica raportul DOAR de pe main (nu din Pull Request-uri)
      - name: Deploy Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # Pasul 7: ...si abia acum marcam build-ul ROSU daca au picat teste
      - name: Fail build if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
